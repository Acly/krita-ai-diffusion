[project]
dynamic = ["version"]
name = "krita-ai-diffusion"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
preview = true
extend-exclude = [
    "ai_diffusion/websockets",
    "ai_diffusion/debugpy",
    "krita.pyi",
    "*.md",
]

[tool.ruff.lint]
ignore = [
    "ASYNC240",
    "B027",  # Client defaults are meant to be overridden selectively, not abstract
    "BLE001",
    "E741",
    "EXE001",
    "FLY002",
    "FURB113",
    "FURB171",
    "PLW0108",  # lambdas in Qt connect() drop the signal's arguments
    "RUF069",  # exact compares against 1.0/0.0 are sentinel checks on UI values
    "SIM102",
    "T100",
    "TRY300",
]

[tool.ruff.format]
docstring-code-format = false

[tool.black]
line-length = 100
preview = true
include = '(ai_diffusion|scripts|tests)/.*\.pyi?$'
extend-exclude = 'websockets|krita\.pyi$'

[tool.pyright]
include = ["ai_diffusion", "scripts/*.py", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.server",
    "tests/server",
    "tests/test_image_transfer.py",
    "ai_diffusion/websockets",
    "ai_diffusion/debugpy",
]
ignore = ["ai_diffusion/websockets", "ai_diffusion/debugpy", "krita.pyi"]
extraPaths = ["scripts/typeshed"]
reportMissingModuleSource = false
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
